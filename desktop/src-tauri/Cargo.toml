[package]
name = "muse-desktop"
version = "0.1.0"
description = "Muse local-first Super Agent command center"
authors = ["Muse"]
edition = "2021"

[lib]
name = "muse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
