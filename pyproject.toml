    "cryptography>=42.0",
]
web-scraping = [
    "scrapling>=0.5.1,<0.6",
]
lightpanda = [
    "playwright>=1.50,<2",
]
video-diagnostics = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
]

[tool.setuptools.package-data]
muse = ["video_pipelines.yaml", "video_stages.yaml"]
